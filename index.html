<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-route title/description/canonical/hreflang/OG/JSON-LD come from <SeoHead> (React 19 hoists them here). -->
    <title>Fiore Vera | virág és dekoráció</title>
    <meta name="author" content="Fiore Vera" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf7f2" />

    <!-- Self-hosted fonts (MASTER-PLAN 1.1): preload the regular faces used above the fold -->
    <link rel="preload" href="/fonts/cormorant-garamond-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <!-- The skip link is rendered by <Layout> in the page's language (first focusable element). -->
    <div id="root"><!--app-html--></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- scripts/prerender.ts localizes this paragraph per route (data-noscript marker). -->
    <noscript>
      <div style="padding: 2rem; text-align: center">
        <p><strong>Fiore Vera</strong></p>
        <p data-noscript>Az oldal teljes működéséhez engedélyezd a JavaScriptet a böngésződben.</p>
      </div>
    </noscript>
  </body>
</html>
